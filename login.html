<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Concesionario</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="../img/logo_conce.jpeg" alt="Logo Concesionario" class="logo">
            <h1>Concesionario CAECE</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Inicio</a></li>
                <li><a href="gestion-vehiculos.html">Vehículos</a></li>
                <li><a href="gestion-clientes.html">Clientes</a></li>
                <li><a href="visualizacion.html">Visualización</a></li>
            </ul>
        </nav>
    </header>
    <main class="login-container">

        <!-- Pantalla inicial -->
        <section id="choiceSection" class="login-form">
            <h1 class="login-title">Bienvenido</h1>
            <p style="text-align:center; margin-bottom:16px;">¿Qué deseas hacer?</p>
            <button class="btn-login" onclick="showForm('login')">Iniciar Sesión</button>
            <button class="btn-login" onclick="showForm('register')">Registrarse</button>
        </section>

            <!-- Formulario Login -->
            <form id="loginSection" class="login-form hidden" method="post">
                <h1 class="login-title">Iniciar Sesión</h1>

                <div class="form-group">
                    <label for="loginEmail">Correo electrónico</label>
                    <input type="email" id="loginEmail" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPass">Contraseña</label>
                    <input type="password" id="loginPass" name="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
                <button type="button" class="btn-login back-btn" onclick="goBack()">Volver</button>
            </form>

            <!-- Formulario Registro -->
            <form id="registerSection" class="login-form hidden" method="post">
                <h1 class="login-title">Registrarse</h1>

                <div class="form-group">
                    <label for="regEmail">Correo electrónico</label>
                    <input type="email" id="regEmail" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="regPass">Contraseña</label>
                    <input type="password" id="regPass" name="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-login">Crear Cuenta</button>
                <button type="button" class="btn-login back-btn" onclick="goBack()">Volver</button>
            </form>
    </main>

    
    <footer>
        <p>&copy; 2025 Concesionario CAECE - Todos los derechos reservados.</p>
    </footer>

    <script src="login.js"></script>
    
</body>
</html>
